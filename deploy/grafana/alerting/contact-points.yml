# Where alerts go: the owner's Telegram chat. The bot's token and the chat id
# come from deploy/.env through the Grafana container's environment; nothing
# secret is in this file. See deploy/RUNBOOK.md, "Alerts on Telegram".
apiVersion: 1

contactPoints:
  - orgId: 1
    name: owner
    receivers:
      - uid: lpbot-telegram
        type: telegram
        settings:
          bottoken: $TELEGRAM_BOT_TOKEN
          chatid: $TELEGRAM_CHAT_ID
          message: '{{ template "lpbot.message" . }}'
          disable_web_page_preview: true
