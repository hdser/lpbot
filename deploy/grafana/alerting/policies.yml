# How often a firing alert repeats. Urgent ones (the node, the watcher, the
# disk, the CPU) every 2 hours; notices (an agent, the status) every 12; the
# daily check-in once a day. A message also comes when an alert resolves.
apiVersion: 1

policies:
  - orgId: 1
    receiver: owner
    group_by: [alertname, agent]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 12h
    routes:
      - receiver: owner
        object_matchers:
          - [kind, "=", heartbeat]
        group_by: [alertname]
        repeat_interval: 24h
      - receiver: owner
        object_matchers:
          - [urgency, "=", urgent]
        repeat_interval: 2h
