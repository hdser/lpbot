apiVersion: 1

providers:
  - name: lpbot
    folder: lpbot
    type: file
    disableDeletion: false
    allowUiUpdates: true
    # Re-read the files this often. If a changed dashboard does not show up,
    # restart Grafana: `docker compose -f deploy/docker-compose.yml restart grafana`.
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards
