# Anchored one-sided entries on USDC/WETH 0.3%, May 2025 to October 2026:
# ETH after ETH rose (betting the rise stalls), entered only once ETH moved
# 3% or 5% within one, four or twelve hours, in a range 300 or 600 ticks
# wide next to the price that stays where it was placed (no moving after the
# price); out after one, three or seven days, at a 5% loss, or, when set, as
# soon as a round trip brings it back wholly into the value token with its
# fees; a day's wait after each campaign. Gas at each block's own price.
# Expands into 72 runs.
#
#   cargo run --release -p lpbot -- run experiments/anchored-eth-usdc-weth-03.yml

experiment: anchored-eth-usdc-weth-03
base: config/mainnet.yml
mode: backtest
window: { from: 2025-05-01, to: 2026-10-31 }
run: { capital_usd: 10000, loss_limit_pct: 50, autonomy: auto }
strategy: eth-zone-roundtrip
sweep:
  pool: ["0x8ad599c3A0ff1De082011EFDDc58f1908eb6e6D8"]   # USDC/WETH 0.3%
  value_token: [WETH]
  capital_share: [1.0]
  signal_step: [5m]
  entry.check_every: [5m]
  entry.min_gas_multiple: [100]
  patience.mode: [wait]
  entry.move_direction: [up]
  entry.after_move_pct: [3, 5]
  entry.move_window: [1h, 4h, 12h]
  entry.width_ticks: [300, 600]
  exit.max_hold: [1d, 3d, 7d]
  exit.after_round_trips: [null, 1]
  exit.max_loss_pct: [5]
  entry.cooldown: [1d]
  entry.reposition: [false]
