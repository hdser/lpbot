# A panel of two agents (docs/DESIGN.md, "Several agents in the agent mode")
# on USDC/WETH 0.05% over three days of history: agent a decides alone, agent
# b reads a's records and scores up to each of its own looks. One run per
# agent; the decisions, logs and scores stay in data/agent/panel-2025-09/
# (not committed). A short window, to try the framework end to end; months
# the models may have seen in training, so practice, not a test.
#
#   target/release/lpbot agent brief experiments/agent-panel-2025-09.yml --agent a
#   target/release/lpbot agent next experiments/agent-panel-2025-09.yml --agent a
#   target/release/lpbot agent evaluate experiments/agent-panel-2025-09.yml
#   target/release/lpbot run experiments/agent-panel-2025-09.yml

experiment: agent-panel-2025-09
base: config/mainnet.yml
mode: backtest
window: { from: 2025-09-01, to: 2025-09-04 }
run: { capital_usd: 10000, loss_limit_pct: 20, autonomy: auto }
strategy: eth-zone-roundtrip
set:
  sim.series_every: 15m
sweep:
  pool: ["0x88e6A0c2dDD26FEEb64F039a2c41296FcB3f5640"]   # USDC/WETH 0.05%
  value_token: [USDC]
  capital_share: [1.0]
  signal_step: [5m]
  agent:
    - { name: a, model: claude-haiku-5-5, decisions: data/agent/panel-2025-09/a.jsonl }
    - { name: b, model: claude-opus-5-5, decisions: data/agent/panel-2025-09/b.jsonl, peers: [a] }
