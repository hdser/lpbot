# Leaving on the way back, on WETH/USDT 0.3%, May 2025 to October 2026: once price
# has run 2%, 5% or 10% past the range, the campaign is closed as soon as
# price is back inside it, instead of waiting for a full pass. Against
# plain waiting. One-sided and around the price, two widths. Expands into
# 32 runs, each counted in ETH and in USD.
#
#   cargo run --release -p lpbot -- run experiments/return-exit-weth-usdt.yml

experiment: return-exit-weth-usdt
base: config/mainnet.yml
mode: backtest
window: { from: 2025-05-01, to: 2026-10-31 }
run: { capital_usd: 10000, loss_limit_pct: 50, autonomy: auto }
strategy: eth-zone-roundtrip
sweep:
  pool: ["0x4e68Ccd3E89f51C3074ca5072bbAC773960dFa36"]   # WETH/USDT 0.3%
  value_token: [WETH, USDT]
  capital_share: [1.0]
  entry.min_gas_multiple: [100]
  patience.mode: [wait]
  entry.shape: [one_sided, around_price]
  entry.width_ticks: [120, 600]
  exit.exit_on_return_pct: [null, 2, 5, 10]
