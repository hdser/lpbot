# Copying real liquidity providers on USDC/WETH 0.05%, May 2025 to 17 November 2026:
# the owners of top open positions on revert.finance's pool pages on 20
# November 2026, each followed with this run's own capital, block by
# block: every position they opened on the pool in the window is entered
# in the same range in the block after theirs, and closed in the block
# after they close it, gas at each block's own price. 13 owner(s),
# each in ETH and in dollars.
#
# The positions file is read from the node first:
#   lpbot lp-positions --nft 1407425 --nft 1407132 --nft 1407225 --nft 1407130 --nft 1404929 --nft 1407375 --nft 1404734 --nft 1404653 --nft 1406652 --nft 1404622 --nft 1404638 --nft 1405205 --nft 675662 --nft 656895 --nft 844936 --nft 1407349 --nft 1407056 --nft 1404849 --nft 1405555 --nft 1406722 --nft 1405593  --from 2025-05-01 --out data/follow/revert.csv
#   cargo run --release -p lpbot -- run experiments/follow-revert-usdc-weth.yml

experiment: follow-revert-usdc-weth
base: config/mainnet.yml
mode: backtest
window: { from: 2025-05-01, to: 2026-11-17 }
run: { capital_usd: 10000, loss_limit_pct: 50, autonomy: auto }
strategy: eth-zone-roundtrip
set:
  sim.series_every: 15m
sweep:
  pool: ["0x88e6A0c2dDD26FEEb64F039a2c41296FcB3f5640"]   # USDC/WETH 0.05%
  value_token: [WETH, USDC]
  capital_share: [1.0]
  follow.file: [data/follow/revert.csv]
  follow.owner: ["0x031b72b676d7c5f76e875ce260b04db1e192d626", "0x04010c1756bec12ff09c7bca3b9f9bbfd434e1c5", "0x2dfd64bbbfd442d1723c30dbaf3147f74324ba1e", "0x325444763a6c569c53e20a39c7426d2890710cab", "0x4d87f57ad8be1d2fff16c3aa84fb2cc61dcc55ba", "0x869f1e25a0e712703b3f5e2d2d56b58ace6b56f7", "0x9cc87c286fe3e6ca968146858c9d2037e18012eb", "0xa1097367be4c8bbdef3d881e3c24e6260afef36e", "0xb4eb77ce7d79ffc2d73629ca35cd74a32494ca48", "0xb7fb2b774eb5e2dad9c060fb367acbdc7fa7099b", "0xdf69fc2ce3b449a2c3d425769ce784a8d73be46b", "0xe29c0ba9d9f8019b4703cab9acf0978b8237687a", "0xe62ff338e9018d85924ee2d91be89d8eed123bcc"]
