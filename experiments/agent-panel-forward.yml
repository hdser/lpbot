# A panel of agents forward, at the head of the chain (docs/DESIGN.md,
# "Several agents in the agent mode"): USDC/WETH 0.05%, value token USDC,
# $10,000 each, every agent deciding its own run look by look in a Claude
# Code session of its own. Agent b reads a's records up to each of its looks,
# and the two may ask each other at a look through the panel's board,
# data/agent/panel-forward/board.jsonl (not committed, with the decisions and
# the logs). Models are the owner's choice: set each `model` to the session's.
#
# Start each session with its brief, which names no dates:
#
#   target/release/lpbot agent brief experiments/agent-panel-forward.yml --agent a
#
# Set `from` to the day the sessions start; once there are decisions, change
# nothing here. deploy/RUNBOOK.md, "A forward run in the agent mode" and "A
# panel of agents forward", has the commands and how a session wakes for its
# looks and for questions:
#
#   target/release/lpbot agent next experiments/agent-panel-forward.yml --agent a --wait 1d
#   target/release/lpbot agent inbox experiments/agent-panel-forward.yml --agent a --wait 1d
#   target/release/lpbot agent ask experiments/agent-panel-forward.yml --agent a --to b --question "..."
#   target/release/lpbot agent answers experiments/agent-panel-forward.yml --agent a --wait
#   target/release/lpbot agent board experiments/agent-panel-forward.yml
#   target/release/lpbot agent evaluate experiments/agent-panel-forward.yml
#   target/release/lpbot run experiments/agent-panel-forward.yml --results-dir runs/panel-forward

experiment: agent-panel-forward
base: config/mainnet.yml
mode: backtest
window: { from: 2026-11-25, to: open }
run: { capital_usd: 10000, loss_limit_pct: 20, autonomy: auto }
strategy: eth-zone-roundtrip
set:
  sim.series_every: 15m
sweep:
  pool: ["0x88e6A0c2dDD26FEEb64F039a2c41296FcB3f5640"]   # USDC/WETH 0.05%
  value_token: [USDC]
  capital_share: [1.0]
  signal_step: [5m]
  agent:
    - { name: a, model: claude-opus-5-5, decisions: data/agent/panel-forward/a.jsonl }
    - { name: b, model: claude-haiku-5-5, decisions: data/agent/panel-forward/b.jsonl, peers: [a] }
