# Intraday positions on USDC/WETH 0.05%, May 2025 to October 2026, decided and
# measured block by block: a one-sided range next to the price, 10, 30 or
# 100 ticks wide, chosen on the last hour and day of trading, looked for
# every minute, closed back to the value token after 15 minutes, an hour or
# four hours, with or without a 0.5% stop. Gas at each block's own price.
# Expands into 36 runs, each counted in ETH and in USD.
#
#   cargo run --release -p lpbot -- run experiments/intraday-hold-usdc-weth.yml

experiment: intraday-hold-usdc-weth
base: config/mainnet.yml
mode: backtest
window: { from: 2025-05-01, to: 2026-10-31 }
run: { capital_usd: 10000, loss_limit_pct: 50, autonomy: auto }
strategy: eth-zone-roundtrip
set:
  sim.series_every: 15m
sweep:
  pool: ["0x88e6A0c2dDD26FEEb64F039a2c41296FcB3f5640"]   # USDC/WETH 0.05%
  value_token: [WETH, USDC]
  capital_share: [1.0]
  signal_step: [1m]
  zone.lookbacks: [[1h, 1d]]
  entry.check_every: [1m]
  patience.mode: [wait]
  patience.decide_every: [1m]
  entry.width_ticks: [10, 30, 100]
  exit.max_hold: [15m, 1h, 4h]
  exit.max_loss_pct: [null, 0.5]
