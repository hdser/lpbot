# Out of sample: the active-management rules on March and April 2026,
# which none of them was chosen on (ETH rose about 16% in dollars). The
# stored history starts on 31 January, so the zones look back 7 and 30
# days instead of up to 90. On the USDC/WETH pools: the plain "wait" rule
# against an entry gate (the day's volatility at most 4 range widths),
# stepping aside to cash (above 12 widths), and both. Expands into 32
# runs, each counted in ETH and in USD.
#
# Research settings: all capital in each campaign, a 50% loss limit so
# every run sees the whole window.
#
#   cargo run --release -p lpbot -- run experiments/unseen-usdc-weth.yml

experiment: unseen-usdc-weth
base: config/mainnet.yml
mode: backtest
window: { from: 2026-03-02, to: 2026-04-30 }
run: { capital_usd: 10000, loss_limit_pct: 50, autonomy: auto }
strategy: eth-zone-roundtrip
sweep:
  pool:
    - "0x88e6A0c2dDD26FEEb64F039a2c41296FcB3f5640"   # USDC/WETH 0.05%
    - "0x8ad599c3A0ff1De082011EFDDc58f1908eb6e6D8"   # USDC/WETH 0.3%
  value_token: [WETH, USDC]
  capital_share: [1.0]
  entry.width_ticks: [40, 120]
  entry.min_gas_multiple: [100]
  entry.max_vol_to_width: [null, 4]
  exit.max_vol_to_width: [null, 12]
  patience.mode: [wait]
  patience.max_wait: [null]
  zone.lookbacks: [[7d, 30d]]
