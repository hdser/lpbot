# How long to stay in, on WETH/USDT 0.3%, May 2025 to October 2026: every campaign
# closed back to the value token after an hour, six hours, a day, a week,
# or never, then entered again at the next look. One-sided and around the
# price, two widths. Expands into 40 runs, each counted in ETH and in USD.
#
#   cargo run --release -p lpbot -- run experiments/horizons-weth-usdt.yml

experiment: horizons-weth-usdt
base: config/mainnet.yml
mode: backtest
window: { from: 2025-05-01, to: 2026-10-31 }
run: { capital_usd: 10000, loss_limit_pct: 50, autonomy: auto }
strategy: eth-zone-roundtrip
sweep:
  pool: ["0x4e68Ccd3E89f51C3074ca5072bbAC773960dFa36"]   # WETH/USDT 0.3%
  value_token: [WETH, USDT]
  capital_share: [1.0]
  entry.min_gas_multiple: [100]
  patience.mode: [wait]
  entry.shape: [one_sided, around_price]
  entry.width_ticks: [120, 600]
  exit.max_hold: [1h, 6h, 1d, 7d, null]
