# One-sided entries on the USDC/WETH pools, May 2025 to October 2026, with the
# plain "wait" rule: the baseline for around-usdc-weth.yml over the same
# window and widths, plus the narrow width the first research round
# favoured. Expands into 16 runs, each counted in ETH and in USD.
#
# Research settings: all capital in each campaign, a 50% loss limit so
# every run sees the whole window, gas at 1 gwei.
#
#   cargo run --release -p lpbot -- run experiments/one-sided-usdc-weth.yml

experiment: one-sided-usdc-weth
base: config/mainnet.yml
mode: backtest
window: { from: 2025-05-01, to: 2026-10-31 }
run: { capital_usd: 10000, loss_limit_pct: 50, autonomy: auto }
strategy: eth-zone-roundtrip
sweep:
  pool:
    - "0x88e6A0c2dDD26FEEb64F039a2c41296FcB3f5640"   # USDC/WETH 0.05%
    - "0x8ad599c3A0ff1De082011EFDDc58f1908eb6e6D8"   # USDC/WETH 0.3%
  value_token: [WETH, USDC]
  capital_share: [1.0]
  entry.shape: [one_sided]
  entry.width_ticks: [40, 120, 600, 2000]
  entry.min_gas_multiple: [100]
  patience.mode: [wait]
