# Mandates and models side by side, forward at the head of the chain
# (docs/DESIGN.md, "Agent setups" and "From a backtest to real positions"):
# USDC/WETH 0.05%, value token USDC, $10,000 each. One model on four mandates
# (none, trend, range, fade) and the trend mandate on three models, each
# agent deciding alone in a folder of its own under
# data/agent/mandates-forward/ (not committed), so none reads another and
# there is no board. Models are the owner's choice: set each `model` to the
# session's. `lpbot select ladder` holds each agent's run against the gates
# to real positions.
#
# Set `from` to the day the sessions start; once there are decisions, change
# nothing here. deploy/RUNBOOK.md, "A forward run in the agent mode", has the
# commands and how a session wakes for its looks:
#
#   deploy/agents/start-agent.sh experiments/agent-mandates-forward.yml s-trend
#   target/release/lpbot agent evaluate experiments/agent-mandates-forward.yml --horizons next,1d
#   target/release/lpbot run experiments/agent-mandates-forward.yml --results-dir runs/mandates-forward
#   target/release/lpbot select ladder selection/ladder.example.yml

experiment: agent-mandates-forward
base: config/mainnet.yml
mode: backtest
window: { from: 2026-12-01, to: open }
run: { capital_usd: 10000, loss_limit_pct: 20, autonomy: auto }
strategy: eth-zone-roundtrip
set:
  sim.series_every: 15m
sweep:
  pool: ["0x88e6A0c2dDD26FEEb64F039a2c41296FcB3f5640"]   # USDC/WETH 0.05%
  value_token: [USDC]
  capital_share: [1.0]
  signal_step: [5m]
  agent:
    - { name: s-open, model: claude-sonnet-5-5, decisions: data/agent/mandates-forward/s-open/s-open.jsonl }
    - { name: s-trend, model: claude-sonnet-5-5, mandate: trend, decisions: data/agent/mandates-forward/s-trend/s-trend.jsonl }
    - { name: s-range, model: claude-sonnet-5-5, mandate: range, decisions: data/agent/mandates-forward/s-range/s-range.jsonl }
    - { name: s-fade, model: claude-sonnet-5-5, mandate: fade, decisions: data/agent/mandates-forward/s-fade/s-fade.jsonl }
    - { name: h-trend, model: claude-haiku-5-5, mandate: trend, decisions: data/agent/mandates-forward/h-trend/h-trend.jsonl }
    - { name: o-trend, model: claude-opus-5-5, mandate: trend, decisions: data/agent/mandates-forward/o-trend/o-trend.jsonl }
