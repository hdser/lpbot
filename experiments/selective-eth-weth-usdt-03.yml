# Selective one-sided entries on WETH/USDT 0.3%, May 2025 to October 2026:
# ETH after ETH rose (betting the rise stalls), entered only once ETH moved 2%, 3% or 5% within one, four or
# twelve hours, in a range 120 or 600 ticks wide next to the price, looked
# for every five minutes; out after one or three days, at a 2% or 5% loss,
# or, when set, as soon as a round trip brings it back wholly into the
# value token with its fees; with or without a day's wait after each
# campaign before the next. Gas at each block's own price. Expands into
# 288 runs; scored walk-forward in docs/RESEARCH.md.
#
#   cargo run --release -p lpbot -- run experiments/selective-eth-weth-usdt-03.yml

experiment: selective-eth-weth-usdt-03
base: config/mainnet.yml
mode: backtest
window: { from: 2025-05-01, to: 2026-10-31 }
run: { capital_usd: 10000, loss_limit_pct: 50, autonomy: auto }
strategy: eth-zone-roundtrip
sweep:
  pool: ["0x4e68Ccd3E89f51C3074ca5072bbAC773960dFa36"]   # WETH/USDT 0.3%
  value_token: [WETH]
  capital_share: [1.0]
  signal_step: [5m]
  entry.check_every: [5m]
  entry.min_gas_multiple: [100]
  patience.mode: [wait]
  entry.move_direction: [up]
  entry.after_move_pct: [2, 3, 5]
  entry.move_window: [1h, 4h, 12h]
  entry.width_ticks: [120, 600]
  exit.max_hold: [1d, 3d]
  exit.after_round_trips: [null, 1]
  exit.max_loss_pct: [2, 5]
  entry.cooldown: [null, 1d]
