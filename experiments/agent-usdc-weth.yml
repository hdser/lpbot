# The agent mode on USDC/WETH 0.05%, July to 17 November 2026: entries and
# exits decided look by look by a person or a session, from how the pool
# looks over several time scales, in dollars. One run; the decisions are
# kept in data/agent/ (not committed), and the run is replayed from them.
#
#   cargo run --release -p lpbot -- agent next experiments/agent-usdc-weth.yml
#   cargo run --release -p lpbot -- agent decide experiments/agent-usdc-weth.yml \
#       --action enter --lower -3 --upper -1 --next 4h --note "why" \
#       --reasoning "what you saw and weighed"
#   (the reasoning goes to data/agent/usdc-weth-2026-07.log.md, local only)
#   cargo run --release -p lpbot -- run experiments/agent-usdc-weth.yml

experiment: agent-usdc-weth
base: config/mainnet.yml
mode: backtest
window: { from: 2026-07-01, to: 2026-11-17 }
run: { capital_usd: 10000, loss_limit_pct: 20, autonomy: auto }
strategy: eth-zone-roundtrip
set:
  sim.series_every: 15m
sweep:
  pool: ["0x88e6A0c2dDD26FEEb64F039a2c41296FcB3f5640"]   # USDC/WETH 0.05%
  value_token: [USDC]
  capital_share: [1.0]
  signal_step: [5m]
  agent.decisions: [data/agent/usdc-weth-2026-07.jsonl]
