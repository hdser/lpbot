# Ranges sized by volatility, on WETH/USDT 0.3%, May 2025 to October 2026: each new
# range half, one, two or four times the day's realized volatility wide,
# instead of a fixed width. One-sided and around the price. Expands into
# 16 runs, each counted in ETH and in USD.
#
#   cargo run --release -p lpbot -- run experiments/vol-width-weth-usdt.yml

experiment: vol-width-weth-usdt
base: config/mainnet.yml
mode: backtest
window: { from: 2025-05-01, to: 2026-10-31 }
run: { capital_usd: 10000, loss_limit_pct: 50, autonomy: auto }
strategy: eth-zone-roundtrip
sweep:
  pool: ["0x4e68Ccd3E89f51C3074ca5072bbAC773960dFa36"]   # WETH/USDT 0.3%
  value_token: [WETH, USDT]
  capital_share: [1.0]
  entry.min_gas_multiple: [100]
  patience.mode: [wait]
  entry.shape: [one_sided, around_price]
  entry.width_ticks: [120]
  entry.width_vol_multiple: [0.5, 1, 2, 4]
