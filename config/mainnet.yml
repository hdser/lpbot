# Shared base config for Ethereum mainnet.
#
# Experiment files in experiments/ point at this file and state only what they
# change. Numbers marked "placeholder" show the shape and are not recommendations.
# Nothing secret belongs here: keys live in a keystore on the machine that runs the bot.

mode: paper              # backtest | paper (simulation on live data) | live

run:                     # inputs to each run; an experiment file or command-line flag sets them
  capital_usd: null      # required: what the run may deploy
  loss_limit_pct: null   # required, no default: the run refuses to start without it
  autonomy: approve      # auto | approve

chains:
  ethereum:
    chain_id: 1
    rpc:
      local: http://127.0.0.1:8545   # the node started by `make up`
      max_head_lag_blocks: 2
    submit: https://rpc.flashbots.net/fast
    custody: { kind: safe_roles, safe: "0x...", roles: "0x..." }
    uniswap_v3_factory: "0x1F98431c8aD98523631AE4a59f267346ea31F984"
    tokens:
      WETH: { address: "0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2", decimals: 18 }
      WBTC: { address: "0x2260FAC5E5542a773Aa44fBCfeDf7C193bc2C599", decimals: 8 }
      USDC: { address: "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48", decimals: 6 }
      USDT: { address: "0xdAC17F958D2ee523a2206206994597C13D831ec7", decimals: 6 }

universe:
  tokens: [WETH, WBTC, USDC, USDT]   # blue chips only; both tokens of a pool must be listed
  usd_stables: [USDC, USDT]          # counted as one dollar when valuing volume and liquidity
  venues: [uniswap_v3]
  fee_tiers: all
  floors:                            # placeholders
    volume_usd_per_day: 5000000      # 7-day average
    in_range_liquidity_usd: 1000000  # within 1% of the price
  max_share_of_in_range_liquidity: 0.05

ranking:
  metric: implied_vol                # from fee, volume and in-range liquidity
  liquidity: in_range                # at the current tick, and per candidate zone
  volume_windows: [24h, 7d]
  refresh: 1h
  top_pools: 4

reference_prices:
  ETH-USD: [binance:ETHUSDC, coinbase:ETH-USD]
  BTC-USD: [binance:BTCUSDC, coinbase:BTC-USD]

strategies:
  - id: eth-zone-roundtrip
    kind: zone_round_trip
    value_token: WETH                # enter and exit in this token; one of universe.tokens
    pools: ranked                    # top pools holding the value token; fee tier follows the ranking
    pool: null                       # or a pool address to trade instead of the ranked one; sweep it to compare fee tiers
    capital_share: 0.25
    signal_step: 10m                 # price steps the volatility, move and odds signals count on; down to 12s, one block
    zone:
      lookbacks: [7d, 30d, 90d]      # durations; the shortest and longest rank ranges; under a day, such as [1h, 6h], for intraday ranges
      rank_by: [passes_per_day, zone_implied_vol]
    entry:
      shape: one_sided               # or around_price: swap part into the other token and hold the range centred on the price
      shapes: [one_sided, around_price]   # what the calibrator may choose from, once it searches shapes
      check_every: 1h                # how often a flat run looks for an entry and a resting one whether to move; 12s is every block
      width_ticks: { min: 10, max: 80 }   # search space, not a choice
      max_gap_ticks: null            # how far from the price an entry may sit; null is one width
      move_margin: 1.5               # a resting range moves to one crossed this many times as often
      min_passes_per_day: 0          # passes per day a range needs on the longest lookback; 0 takes any crossed lately
      max_vol_to_width: null         # enter only while the day's volatility is at most this many range widths
      max_daily_vol_pct: null        # enter only while the day's volatility is at most this, in percent
      min_gas_multiple: null         # an entry must put in this many times the gas of its open, close and swap
      after_move_pct: null           # enter only after price moved this many percent within move_window: a fast move up or down
      move_window: 4h
      move_direction: any            # any | up | down, as the volatile token's dollar price
      vol_window: 1d                 # how far back the volatility gates and width_vol_multiple measure; per day whatever the window
      cooldown: null                 # after a campaign ends, no new one for this long, such as 12h: one entry per move
      reposition: true               # move a resting range price has left, or for a much busier one; false leaves it until an exit
      width_vol_multiple: null       # ranges this many times the day's volatility wide, instead of width_ticks
    # Optional settings, read with a default when left out (lpbot_core::experiment::OPTIONAL_SETTINGS).
    # They stay out of this file so that runs which do not set them keep their identity; set them in a sweep.
    # regime:                          # the long timeframe a campaign may start in, on the volatile token's dollar price; every gate off unless set
    #   trend_window: 30d              # how far back the trend looks
    #   trend_min_pct: null            # enter only if price changed at least this much over trend_window; negative allows a fall that deep
    #   trend_max_pct: null            # and at most this much
    #   chop_window: 7d                # how far back the straightness of the move is measured, in 24 steps
    #   min_efficiency: null           # 0 (price came back to where it was) to 1 (it only went one way): at least this straight
    #   max_efficiency: null           # at most this straight: a market going sideways; a random walk measures about 0.2
    #   band_window: 30d               # how far back the band of lowest and highest price looks
    #   band_min: null                 # where price sits in the band, 0 (its low) to 1 (its high): at least here
    #   band_max: null                 # and at most here
    patience:
      mode: adaptive                 # or a fixed rule: wait | flip | close
      decide_every: 1h
      switch_margin: calibrated      # or a fixed percentage
      max_wait: null                 # close a position stranded beyond its range this long, such as 72h
    exit:
      max_vol_to_width: null         # a resting range steps aside to cash while the day's volatility exceeds this many widths
      recenter_after: null           # around the price only: move a position price has left this long (0: at once) to the range around the price, with one swap
      max_hold: null                 # close a campaign open this long, such as 6h or 7d
      max_loss_pct: null             # close a campaign that fell this many percent below what went in, back to the value token
      max_drawdown_pct: null         # close a campaign that fell this many percent of what went in from its best
      exit_on_return_pct: null       # once price ran this many percent past the range, close as soon as it is back in the range
      after_round_trips: null        # close once back wholly in the value token, fees on top, after this many round trips (1: the first)
      # trend_min_pct: (optional)      # close a campaign once the change over regime.trend_window has fallen below this
      # trend_max_pct: (optional)      # or risen above this
    follow:                          # copy a provider's positions instead of choosing ranges
      file: null                     # positions written by `lpbot lp-positions`, such as data/follow/x.csv
      owner: null                    # one owner of the file, "0x..."; null follows every owner in it
      join_within: 1h                # a position is copied only this soon after the provider opened it
    agent:                           # entries and exits decided at each look by a person or a session: `lpbot agent next` / `decide`
      decisions: null                # the decisions file, such as data/agent/x.jsonl; null runs the strategy's own rules
      name: null                     # the agent's handle, and its decisions file's name (b decides b.jsonl); null: the file's name
      model: null                    # the Claude model id of the session deciding, or person; recorded with every look
      peers: null                    # agents whose records it is handed up to its own look, such as [a]; names in the same folder, or paths
      # mandate: (optional)            # a way of trading the agent is told to follow in its brief: open (or null) | trend | range | fade | patient
    allocator:
      campaign_size_usd: 500         # placeholder
      min_explore_share: 0.2         # capital kept on non-leading settings

calibration:
  method: walk_forward
  fit_window: 90d
  score_window: 14d
  rerun: weekly
  promote: beats_current_and_fixed_rules
  pinned: {}

sim:                                 # backtest and paper runs
  latency_blocks: 1                  # blocks between a decision and its fill; at least 1
  series_every: 1h                   # spacing of the rows in the series table

costs:                               # what the simulator charges
  gas: chain                         # chain: each block's base fee plus priority fee, stored by `lpbot gas-history`; fixed: gas_price_gwei on every block
  priority_fee_gwei: median          # on top of the base fee; median is the median tip of the last 20 blocks, as a wallet sets it
  gas_price_gwei: 1.0                # with gas: fixed
  gas_units: { open: 450000, close: 300000, swap: 180000 }
  # eth_price_usd: 2000              # only for pools that hold no WETH

risk:                                # placeholders
  max_notional_usd: { per_pool: 20000, per_chain: 50000, total: 80000 }
  max_actions_per_day: 12
  max_swap_slippage_bps: 8
  max_pool_vs_reference_bps: 15
  loss_window: 30d                   # not read yet: run.loss_limit_pct is measured from starting capital over the whole run
  heartbeat_timeout: 90s
